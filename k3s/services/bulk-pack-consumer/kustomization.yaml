# Local (k3d) overlay for bulk-pack-consumer, pointed at LocalStack (Route 2, fully local).
# Reuses the base deployment (which reads DATABASE_URL, SQS_URL and the AWS_* env from secrets),
# swaps in the locally-built image, and drops the DigitalOcean node-affinity. The two LocalStack
# knobs the base lacks (AWS_ENDPOINT + AWS_REGION) come from the `localstack-endpoint` secret the
# capture adapter declares (values expand from LOCALSTACK_PORT / OBJECT_STORAGE_REGION, single
# source of truth), so nothing is hardcoded here. All secrets (db, sqs-url, aws-key-id, aws-key,
# localstack-endpoint) are created imperatively by up.sh, so no real AWS creds ever land in git.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: bulk-pack-services
resources:
  # A vendored copy of the base Deployment manifest. The base kustomization also bundles
  # SealedSecrets (they need the sealed-secrets controller), and kustomize path-security
  # forbids referencing a single file above this directory. Locally the four secrets are
  # supplied as plain Secrets instead, so only the Deployment is reused.
  - bulk-pack-consumer-deployment.yaml
images:
  - name: greenstand/bulk-pack-consumer
    newName: bulk-pack-consumer
    newTag: local
patches:
  - target: { kind: Deployment, name: bulk-pack-consumer }
    patch: |-
      - op: remove
        path: /spec/template/spec/affinity
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_ENDPOINT
          valueFrom:
            secretKeyRef:
              name: localstack-endpoint
              key: endpoint
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: AWS_REGION
          valueFrom:
            secretKeyRef:
              name: localstack-endpoint
              key: region
