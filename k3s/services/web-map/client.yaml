# web-map-client: authored local manifests (the repo base routes by Host for prod; local uses the
# path prefix /map, baked into the Next build as NEXT_PUBLIC_BASE by the :local image).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web-map-client
  namespace: webmap
spec:
  replicas: 1
  selector:
    matchLabels: { app: web-map-client }
  template:
    metadata:
      labels: { app: web-map-client }
    spec:
      containers:
        - name: web-map-client
          image: web-map-client:local
          imagePullPolicy: Never
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: web-map-client
  namespace: webmap
spec:
  selector: { app: web-map-client }
  ports:
    - port: 80
      targetPort: 3000
---
apiVersion: getambassador.io/v2
kind: Mapping
metadata:
  name: web-map-client
  namespace: webmap
spec:
  # /map (no trailing slash): Next serves basePath /map and 308-redirects /map/ -> /map, so the
  # bare form must route too. Keep the prefix on the path: no rewrite.
  prefix: /map
  service: web-map-client
  rewrite: ""
  timeout_ms: 30000
