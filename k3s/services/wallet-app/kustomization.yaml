# Aggregate overlay for the wallet-app subsystem. Each child sets its OWN namespace, so no global
# namespace is set here (that would force both services into one namespace).
#  - wallet-api/ : the legacy wallet-api service (namespace wallet-api)
#  - user/       : apps/user, the NestJS user-api (namespace treetracker-wallet-monorepo-user-api)
#  - web/        : apps/web, the Next 14 static SPA served by nginx (namespace wallet-web)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - wallet-api
  - user
  - web
