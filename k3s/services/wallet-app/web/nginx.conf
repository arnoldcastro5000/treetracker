# Static-only SPA server for the Next 14 export (apps/web). Emissary rewrites /wallet -> / at the
# gateway, so nginx serves the export at root. Next export writes a file per route (login.html, ...),
# so try $uri.html before the index fallback for client routing.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}
