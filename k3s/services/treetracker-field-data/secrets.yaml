# Local plain Secrets replacing the base sealed-secrets. Both DB envs use one `treetracker` DB
# (field_data schema via DATABASE_SCHEMA; public.trees via the legacy connection).
apiVersion: v1
kind: Secret
metadata:
  name: database-connection
  namespace: field-data-api
stringData:
  db: "postgresql://postgres:postgres@postgres.data.svc.cluster.local:5432/treetracker"
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-connection
  namespace: field-data-api
stringData:
  messageQueue: "amqp://guest:guest@rabbitmq.rabbitmq.svc.cluster.local:5672"
