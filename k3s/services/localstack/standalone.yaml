# Stand-up adapter: shared LocalStack (S3 + SQS), a conditional tier service (shared-object-
# storage decision). A HOST-side docker container on :4566, not a cluster workload: the Android
# emulator must reach it as 10.0.2.2:4566 and in-cluster clients as host.k3d.internal:4566.
# The up hook only runs the container and waits for readiness; each subsystem DECLARES its
# buckets/queues/notifications in its own adapter (objectStorage) and the orchestrator
# provisions them idempotently in one region (eu-central-1).
name: localstack
tier: conditional
# The /s3 read-base Mapping is a gateway CRD, so the gateway (Emissary CRDs) must be up first.
dependsOn: [gateway]
namespaces: [object-storage]
overlay: k3s/services/localstack
hooks:
  up: k3s/services/localstack/hooks/up.sh
  down: k3s/services/localstack/hooks/down.sh
