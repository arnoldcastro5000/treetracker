# Keycloak identity tier (conditional; identity-coexistence decision). Runs in dev mode with the
# official image, persisting to the shared Postgres `keycloak` schema (created by the postgres
# initdb). The realm `treetracker` and a shared test user import at first boot from the mounted
# ConfigMap. A subsystem that needs its own OIDC client (e.g. wallet-app) creates it later with a
# kcadm hook, using the master bootstrap admin seeded here; the tier never bakes subsystem clients.
apiVersion: v1
kind: Namespace
metadata:
  name: keycloak
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: keycloak
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          image: quay.io/keycloak/keycloak:26.0.7
          imagePullPolicy: IfNotPresent
          args: ["start-dev", "--import-realm"]
          env:
            # Master bootstrap admin (first boot only) from the orchestrator-created dummy secret.
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
            # Persist to the shared Postgres, scoped to its own schema.
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres.data.svc.cluster.local:5432/treetracker?currentSchema=keycloak
            - name: KC_DB_USERNAME
              value: postgres
            - name: KC_DB_PASSWORD
              value: postgres
            # Local single-origin gateway: plain HTTP, no strict hostname, health endpoints on :9000.
            - name: KC_HTTP_ENABLED
              value: "true"
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HEALTH_ENABLED
              value: "true"
          ports:
            - { name: http, containerPort: 8080 }
            - { name: management, containerPort: 9000 }
          startupProbe:
            httpGet: { path: /health/started, port: management }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /health/ready, port: management }
            periodSeconds: 10
          resources:
            requests: { memory: 512Mi, cpu: 250m }
          volumeMounts:
            - name: realm-import
              mountPath: /opt/keycloak/data/import
              readOnly: true
      volumes:
        - name: realm-import
          configMap: { name: keycloak-realm }
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: keycloak
spec:
  selector: { app: keycloak }
  ports:
    - { name: http, port: 8080, targetPort: 8080 }
