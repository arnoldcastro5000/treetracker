# Co-located Route 2 Android E2E: stands up the WHOLE local backend (k3d capture
# pipeline + host-side LocalStack + admin /verify) and an accelerated Android
# emulator in ONE ubuntu-latest job, then drives the real `.local` APK through the
# full capture -> upload -> pipeline -> admin /verify loop against that local stack.
#
# This is the CI arm of the "Validate the real app upload fidelity" effort. It is
# SEPARATE from the fast, PR-gated, offline android-e2e.yml (02_signup_flow), which
# must never regress. This heavy job runs on demand / on a branch pattern, never on
# every PR (see .scratch/volunteer-e2e-ci/issues/21-colocated-route2-ci-job-shape.md).
#
# First-green is STAGED so a red run points at one cause:
#   stage 1  coexistence : stack up + smoke + two-file backend test + emulator boots
#                          + `.local` APK installs + offline 02 green.
#   stage 2  fidelity    : real APK runs 03 (capture -> upload); the /verify Chrome
#                          assertion is skipped; the upload is asserted to LAND in
#                          field_data.raw_capture.
#   stage 3  full (default): real APK runs 03 end to end incl. the /verify assertion.
name: Android E2E (Route 2, co-located)

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "First-green stage: 1 coexistence, 2 upload-fidelity, 3 full /verify"
        type: choice
        default: "3"
        options: ["1", "2", "3"]
  push:
    branches:
      - "**route2-e2e**"
  # Once reliably green, enable a slow cadence instead of leaning on manual dispatch:
  # schedule:
  #   - cron: "0 4 * * *"   # nightly 04:00 UTC

jobs:
  e2e-route2:
    runs-on: ubuntu-latest
    # Cold: builds ~9 pipeline images + boots k3d + LocalStack + the emulator, then
    # runs 03 (processor CronJob is minute-cadenced). Generous ceiling; ticket 20
    # flags a standard public runner as tight.
    timeout-minutes: 90

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Standard hygiene: the co-located stack builds ~10 pipeline images plus an emulator
      # system image against ubuntu-latest's ~14 GB free disk. Reclaim space from large
      # preinstalled toolchains we never use (keep the Android SDK - the APK build and the
      # emulator need it). df -h before/after makes the headroom a visible, tracked metric.
      - name: Free up disk space
        run: |
          echo "== disk before =="; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          echo "== disk after =="; df -h /

      - name: Resolve stage
        run: |
          # The push default tracks the current first-green target. Stages 1
          # (coexistence) and 2 (real-app upload fidelity, raw_capture grows) are proven
          # green, so pushes now run stage 3 (full 03 incl. the desktop-Chrome admin
          # /verify). workflow_dispatch keeps the stage picker for regressions.
          # EXPERIMENT BRANCH (probe/route2-e2e-camexp): default stage 2 (skip admin /verify,
          # keep k3s + the upload-landed assertion). Real tree camera is toggled by the emulator
          # config below, NOT by the stage. Do NOT merge this branch to the green pipeline.
          STAGE="${{ github.event.inputs.stage || '2' }}"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          # EXPERIMENT: API 34 exposes Compose semantics to UiAutomator more slowly than
          # API 30 (issue #23). Give the a11y-readiness gate a longer window to classify
          # slow-race vs permanent-empty before onboarding can even reach the camera.
          echo "E2E_READINESS_TIMEOUT_MS=300000" >> "$GITHUB_ENV"
          # Strict tags ONLY for stage 1 (offline 02, fully id-tapped + proven). The 03
          # capture controls need the app's designed COORDINATE fallback (the tag's
          # bounds-center clickGesture does not trigger the CaptureButton), and strict
          # throws before that fallback runs. So leave strict OFF for stages 2/3.
          #
          # E2E_SKIP_RELAUNCH: 03 is a single scenario, so it does NOT need
          # launchWithExistingUser's terminate+activate relaunch - and that relaunch
          # leaves Jetpack Compose semantics unexposed to UiAutomator (empty a11y tree,
          # stalls on the language picker). Set it for both 03 stages. A future
          # multi-scenario suite must instead reset without a relaunch (or poll the
          # page source until non-empty) to keep scenario isolation.
          case "$STAGE" in
            1) echo "E2E_SPEC=02_signup_flow.feature" >> "$GITHUB_ENV"
               echo "E2E_STRICT_TAGS=1"               >> "$GITHUB_ENV" ;;
            2) echo "E2E_SPEC=03_capture_setup.feature" >> "$GITHUB_ENV"
               echo "E2E_SKIP_ADMIN_VERIFY=1"           >> "$GITHUB_ENV"
               echo "E2E_SKIP_RELAUNCH=1"               >> "$GITHUB_ENV" ;;
            3) echo "E2E_SPEC=03_capture_setup.feature" >> "$GITHUB_ENV"
               echo "E2E_SKIP_RELAUNCH=1"               >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown stage '$STAGE'"; exit 1 ;;
          esac
          echo "Resolved stage $STAGE"

      # Single source of truth for the local admin creds: the orchestrator defaults.
      # seed-admin (inside up.sh) seeds THIS row and the e2e verify step logs in with
      # the SAME values. No secrets: Route 2 uses static local dummy creds. Deriving
      # them here (masked) avoids duplicating the literal in the committed workflow.
      - name: Resolve admin creds from orchestrator defaults
        run: |
          . k3s/lib/orchestrator-lib.sh
          echo "::add-mask::$ADMIN_PASSWORD"
          {
            echo "ADMIN_USER=$ADMIN_USER"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "ADMIN_URL=$GATEWAY_URL"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installs the k3d/kubectl/yq/helm the orchestrator needs (Docker is preinstalled
      # on ubuntu-latest). up.sh then creates the k3d cluster and the stack itself.
      # SKIP_SUBMODULE_BRANCHES: the checkout above already pinned every submodule to its
      # superproject commit, so prepare-linux must not force them onto the k3s branch.
      - name: Install cluster tools
        env:
          SKIP_SUBMODULE_BRANCHES: "1"
        run: ./k3s/prepare-linux.sh

      # Stand up the full capture subsystem (postgres + gateway + LocalStack + the
      # capture/verify pipeline + admin) against a fresh k3d cluster, then seed the
      # admin row (seed-admin uses ADMIN_USER/ADMIN_PASSWORD from the job env).
      - name: Stand up local stack (up.sh capture)
        run: ./k3s/up.sh capture

      - name: Verify stack (smoke gate)
        run: ./k3s/up.sh verify capture

      # Backend proof that the REAL two-file upload pattern flows end to end, in both
      # orders (happy path + orphan self-heal). Runs without the emulator, so it is the
      # cheapest fidelity signal; gate it to stage 1 (later stages exercise the real APK).
      - name: Backend two-file acceptance
        if: env.STAGE == '1'
        run: ./k3s/route2-two-file-test.sh

      # 02 is offline and the local build's S3/API values point at the emulator host
      # alias, so these placeholder Android keys only let Gradle configuration resolve.
      # Route 2 needs no real Cognito/AWS secrets (static creds live in the local variant).
      - name: Write dummy Android keys
        run: |
          cat > treetracker-android/treetracker.keys.properties <<'KEYS'
          s3_production_identity_pool_id=placeholder
          prod_treetracker_client_id=placeholder
          prod_treetracker_client_secret=placeholder
          s3_test_identity_pool_id=placeholder
          test_treetracker_client_id=placeholder
          test_treetracker_client_secret=placeholder
          s3_dev_identity_pool_id=placeholder
          dev_treetracker_client_id=placeholder
          dev_treetracker_client_secret=placeholder
          treetracker_client_id=placeholder
          treetracker_client_secret=placeholder
          KEYS

      - name: Build local APK
        working-directory: treetracker-android
        run: ./gradlew :app:assembleLocal --no-daemon --stacktrace

      - name: Install e2e dependencies
        working-directory: apps/e2e
        run: npm ci

      # See android-e2e.yml: the @wdio/appium-service spawns a bare `appium`, so it must
      # be on PATH globally; pin the uiautomator2 driver to the lockfile-resolved version.
      - name: Install Appium and UiAutomator2 driver (global)
        run: |
          npm install -g appium@2.19.0
          appium driver install uiautomator2@3.10.0

      # The /verify step (stage 3) drives desktop Chrome via the chromedriver npm binary.
      # The runner's Chrome auto-updates, so match the driver to the installed major
      # instead of the package's pinned version, or the session fails to start.
      - name: Match chromedriver to runner Chrome
        if: env.STAGE == '3'
        working-directory: apps/e2e
        env:
          DETECT_CHROMEDRIVER_VERSION: "true"
          CHROMEDRIVER_FORCE_DOWNLOAD: "true"
        run: |
          google-chrome --version || true
          npm rebuild chromedriver

      # Record the capture baseline so stage 2 can assert the real upload LANDED.
      - name: Snapshot raw_capture baseline
        if: env.STAGE == '2'
        run: |
          POD=$(kubectl -n data get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          [ -n "$POD" ] || { echo "::error::no postgres pod"; exit 1; }
          BASE=$(kubectl -n data exec -i "$POD" -- \
            psql -U postgres -d treetracker -tAc "SELECT count(*) FROM field_data.raw_capture")
          echo "RAW_CAPTURE_BASELINE=${BASE:-0}" >> "$GITHUB_ENV"
          echo "raw_capture baseline = ${BASE:-0}"

      # EXPERIMENT: place the bundled test tree image as the virtualscene poster, so the
      # emulator's back camera "sees" a real tree (Exp A, amended). Absolute path required.
      - name: Prepare virtualscene poster (real tree camera experiment)
        run: |
          cp treetracker-android/app/src/main/assets/testtreeimage.jpg \
             "${{ github.workspace }}/tree-poster.jpg"
          ls -l "${{ github.workspace }}/tree-poster.jpg"

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ github.workspace }}/treetracker-android/app/build/outputs/apk/local/app-local.apk
          APP_PACKAGE: org.greenstand.android.TreeTracker.local
          DEVICE_NAME: emulator-5554
          CAPTURE_ARTIFACTS: "1"
          # ADMIN_URL / ADMIN_USER / ADMIN_PASSWORD / E2E_SKIP_ADMIN_VERIFY / E2E_STRICT_TAGS
          # are inherited from the job env / the Resolve-stage step (strict is stage-1 only).
        with:
          # EXPERIMENT (Exp A, amended): API 34 (API 30 is Google's known-bad camera env),
          # back camera = virtualscene with the tree poster so real CameraX capture has real
          # content. Front camera stays `emulated` (virtualscene is back-lens only; the selfie
          # keeps the .local bypass). `adb shell setprop debug.e2e.realtree 1` (below) makes the
          # app run the REAL CameraX path for the tree only.
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_5
          disable-animations: true
          working-directory: apps/e2e
          # `wall` is a real poster slot in the default virtualscene (Toren1BD.posters);
          # `tree` was ignored (wrong slot) so the scene showed the default green/checkerboard
          # test pattern instead of our image. `wall=` places the tree image on the room wall.
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back virtualscene -virtualscene-poster wall=${{ github.workspace }}/tree-poster.jpg -camera-front emulated
          # The emulator-runner runs each script LINE as a separate `sh -c` and aborts
          # at the first non-zero line, so trailing capture lines never run after a wdio
          # failure. Wrap the run + logcat dump in ONE bash -c so the device log is always
          # captured (CameraX bind path + the .local bypass Timber line) before the exit.
          script: |
            adb wait-for-device
            adb shell setprop debug.e2e.realtree 1
            adb logcat -c || true
            bash -c 'export PATH="$(pwd)/node_modules/.bin:$PATH"; mkdir -p test-artifacts; adb logcat > test-artifacts/logcat.txt 2>&1 & LPID=$!; adb shell dumpsys media.camera > test-artifacts/camera-dumpsys-before.txt 2>&1 || true; ./node_modules/.bin/wdio run ./wdio.conf.ts --spec "features/$E2E_SPEC"; ec=$?; adb shell dumpsys media.camera > test-artifacts/camera-dumpsys-after.txt 2>&1 || true; sleep 2; kill $LPID 2>/dev/null || true; exit $ec'

      # Stage-2 fidelity assertion: the real APK's capture must have reached the DB.
      # The consumer inserts into bulk_tree_upload immediately, but the minute-cadenced
      # processor propagates it to field_data.raw_capture asynchronously - and the slower
      # real-camera flow shifts the upload past a processor cycle. So POLL for up to ~3
      # minutes rather than checking once (a single check is racy).
      - name: Assert upload landed (stage 2)
        if: env.STAGE == '2'
        run: |
          POD=$(kubectl -n data get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          [ -n "$POD" ] || { echo "::error::no postgres pod"; exit 1; }
          for i in $(seq 1 18); do
            NOW=$(kubectl -n data exec -i "$POD" -- \
              psql -U postgres -d treetracker -tAc "SELECT count(*) FROM field_data.raw_capture")
            echo "[$i] raw_capture now = ${NOW:-0} (baseline ${RAW_CAPTURE_BASELINE})"
            if [ "${NOW:-0}" -gt "${RAW_CAPTURE_BASELINE}" ]; then
              echo "real-app upload landed: raw_capture grew ${RAW_CAPTURE_BASELINE} -> ${NOW}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::real-app capture did not land in field_data.raw_capture within ~3m"
          exit 1

      # Always-on component status roster (success or fail), captured while the cluster is
      # still up (before teardown): every pod + deployment readiness, to the artifacts AND
      # the run summary page so each run is self-documenting and the health of every
      # component is a tracked signal as the stack grows.
      - name: Component status report
        if: always()
        run: |
          DIR=apps/e2e/test-artifacts/status
          mkdir -p "$DIR"
          {
            echo "### Component status (stage ${STAGE:-?})"
            echo '```'
            kubectl get pods -A -o wide 2>&1 || true
            echo
            kubectl get deploy,cronjob -A 2>&1 || true
            echo '```'
          } | tee "$DIR/components.txt" >> "$GITHUB_STEP_SUMMARY"
          kubectl get svc -A > "$DIR/services.txt" 2>&1 || true

      # Cluster diagnostics for a failed run (pods + recent logs of the pipeline).
      - name: Collect k8s diagnostics
        if: failure()
        run: |
          DIR=apps/e2e/test-artifacts/k8s
          mkdir -p "$DIR"
          kubectl get pods -A -o wide                    > "$DIR/pods.txt" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > "$DIR/events.txt" 2>&1 || true
          for ns in data object-storage bulk-pack-services field-data-api \
                    treetracker-api images-api admin-api admin-client emissary; do
            for pod in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              name="${pod#pod/}"
              kubectl -n "$ns" logs --all-containers --tail=300 "$pod" \
                > "$DIR/logs-$ns-$name.txt" 2>&1 || true
            done
          done

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-route2-evidence-stage${{ env.STAGE }}
          path: apps/e2e/test-artifacts/
          if-no-files-found: warn

      - name: Tear down cluster
        if: always()
        run: ./k3s/down.sh || true
