# Co-located Route 2 Android E2E: stands up the WHOLE local backend (k3d capture
# pipeline + host-side LocalStack + admin /verify) and an accelerated Android
# emulator in ONE ubuntu-latest job, then drives the real `.local` APK through the
# full capture -> upload -> pipeline -> admin /verify loop against that local stack.
#
# It ALSO stands up the opt-in web-map thin spine (node-mapnik tile server + query-api
# + Next.js client) on top of the same capture backend and verifies it, so one run
# covers the app-upload loop AND the web-map read path.
#
# This is the CI arm of the "Validate the real app upload fidelity" effort. It is
# SEPARATE from the fast, PR-gated, offline android-e2e.yml (02_signup_flow), which
# must never regress. This heavy job runs on EVERY code or configuration change (any
# branch); a docs-only push is skipped
# (see .scratch/volunteer-e2e-ci/issues/21-colocated-route2-ci-job-shape.md).
#
# First-green is STAGED so a red run points at one cause:
#   stage 1  coexistence : stack up + smoke + two-file backend test + emulator boots
#                          + `.local` APK installs + offline 02 green.
#   stage 2  fidelity    : real APK runs 03 (capture -> upload); the /verify Chrome
#                          assertion is skipped; the upload is asserted to LAND in
#                          field_data.raw_capture.
#   stage 3  full (default): real APK runs 03 end to end incl. the /verify assertion.
name: Android E2E (Route 2, co-located)

# Carry the stage + ref in the run-list title, so a volunteer reads what a run is WITHOUT
# opening it. It mirrors the Resolve-stage default (push -> stage 3). run-name may reference
# only the `github` and `inputs` contexts.
run-name: "E2E Route2 stage ${{ github.event.inputs.stage || '3' }} @ ${{ github.ref_name }}"

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "First-green stage: 1 coexistence, 2 upload-fidelity, 3 full /verify"
        type: choice
        default: "3"
        options: ["1", "2", "3"]
  push:
    # Runs on EVERY code or configuration change, on any branch. A docs-only push is
    # skipped: when ALL changed files match these patterns the run does not start; a push
    # that mixes docs with any code/config change still runs.
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "apps/e2e/docs/**"

# One run per branch: a newer push cancels the in-flight run for the same ref so rapid
# pushes do not pile up ~1-2h jobs on the runners.
concurrency:
  group: e2e-route2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-route2:
    runs-on: ubuntu-latest
    # Cold: builds ~9 capture pipeline images + the 3 web-map images (node-mapnik is the
    # long pole) + boots k3d + LocalStack + the emulator, then runs 03 (processor CronJob
    # is minute-cadenced). Raised to 120 for the added web-map standup; ticket 20 flags a
    # standard public runner as tight.
    timeout-minutes: 120

    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Standard hygiene: the co-located stack builds ~10 pipeline images plus an emulator
      # system image against ubuntu-latest's ~14 GB free disk. Reclaim space from large
      # preinstalled toolchains we never use (keep the Android SDK - the APK build and the
      # emulator need it). df -h before/after makes the headroom a visible, tracked metric.
      - name: Free up disk space
        run: |
          echo "== disk before =="; df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache/CodeQL /usr/share/swift || true
          echo "== disk after =="; df -h /

      - name: Resolve stage
        run: |
          # The push default tracks the current first-green target. Stages 1
          # (coexistence) and 2 (real-app upload fidelity, raw_capture grows) are proven
          # green, so pushes now run stage 3 (full 03 incl. the desktop-Chrome admin
          # /verify). workflow_dispatch keeps the stage picker for regressions.
          STAGE="${{ github.event.inputs.stage || '3' }}"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"
          # Strict tags ONLY for stage 1 (offline 02, fully id-tapped + proven). The 03
          # capture controls need the app's designed COORDINATE fallback (the tag's
          # bounds-center clickGesture does not trigger the CaptureButton), and strict
          # throws before that fallback runs. So leave strict OFF for stages 2/3.
          #
          # E2E_SKIP_RELAUNCH: 03 is a single scenario, so it does NOT need
          # launchWithExistingUser's terminate+activate relaunch - and that relaunch
          # leaves Jetpack Compose semantics unexposed to UiAutomator (empty a11y tree,
          # stalls on the language picker). Set it for both 03 stages. A future
          # multi-scenario suite must instead reset without a relaunch (or poll the
          # page source until non-empty) to keep scenario isolation.
          case "$STAGE" in
            1) echo "E2E_SPEC=02_signup_flow.feature" >> "$GITHUB_ENV"
               echo "E2E_STRICT_TAGS=1"               >> "$GITHUB_ENV" ;;
            2) echo "E2E_SPEC=03_capture_setup.feature" >> "$GITHUB_ENV"
               echo "E2E_SKIP_ADMIN_VERIFY=1"           >> "$GITHUB_ENV"
               echo "E2E_SKIP_RELAUNCH=1"               >> "$GITHUB_ENV" ;;
            3) echo "E2E_SPEC=03_capture_setup.feature" >> "$GITHUB_ENV"
               echo "E2E_SKIP_RELAUNCH=1"               >> "$GITHUB_ENV" ;;
            *) echo "::error::unknown stage '$STAGE'"; exit 1 ;;
          esac
          echo "Resolved stage $STAGE"

      # Single source of truth for the local admin creds: the orchestrator defaults.
      # seed-admin (inside up.sh) seeds THIS row and the e2e verify step logs in with
      # the SAME values. No secrets: Route 2 uses static local dummy creds. Deriving
      # them here (masked) avoids duplicating the literal in the committed workflow.
      - name: Resolve admin creds from orchestrator defaults
        run: |
          . k3s/lib/orchestrator-lib.sh
          echo "::add-mask::$ADMIN_PASSWORD"
          {
            echo "ADMIN_USER=$ADMIN_USER"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD"
            echo "ADMIN_URL=$GATEWAY_URL"
          } >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Installs the k3d/kubectl/yq/helm the orchestrator needs (Docker is preinstalled
      # on ubuntu-latest). up.sh then creates the k3d cluster and the stack itself.
      # Submodules stay PINNED by prepare-linux's default (the checkout above already put
      # every submodule on its superproject commit; the pinned path is a no-op here).
      - name: Install cluster tools
        run: |
          echo "::group::prepare-linux.sh"
          ./k3s/prepare-linux.sh
          echo "::endgroup::"

      # Stand up the full capture subsystem (postgres + gateway + LocalStack + the
      # capture/verify pipeline + admin) against a fresh k3d cluster, then seed the
      # admin row (seed-admin uses ADMIN_USER/ADMIN_PASSWORD from the job env).
      - name: Stand up local stack (up.sh capture)
        run: |
          echo "::group::up.sh capture"
          ./k3s/up.sh capture
          echo "::endgroup::"

      - name: Verify stack (smoke gate)
        run: ./k3s/up.sh verify capture

      # Stand up the opt-in web-map thin spine on top of the capture backend: node-mapnik
      # tile server (/tiles/), query-api (/query/ + the /webmap/ compat prefix), the
      # Next.js client (/map), and the empty webmap.* schema hook, all behind the shared
      # gateway. It reads the capture stack's treetracker DB (trees) + images-api, so it
      # MUST come after the capture standup above.
      - name: Stand up web-map spine (up.sh web-map)
        run: |
          echo "::group::up.sh web-map"
          ./k3s/up.sh web-map
          echo "::endgroup::"

      # Definition-of-done for the thin spine: client HTML at /map/, query-api JSON on
      # /query/ AND the /webmap/ compat prefix, a z16 tile PNG over the Buwagi capture
      # area, and the webmap.* schema. With no captured trees yet the data-conditional dot
      # check is skipped; everything else must be green.
      - name: Verify web-map spine
        run: ./k3s/up.sh verify web-map

      # The capture + web-map image builds now live in k3d's containerd; the docker build
      # cache and dangling layers are no longer needed. Reclaim that space before the
      # emulator downloads its system image, to keep this single runner off the disk edge.
      - name: Reclaim docker build space
        run: |
          echo "== disk before reclaim =="; df -h /
          docker builder prune -af || true
          docker image prune -f || true
          echo "== disk after reclaim =="; df -h /

      # Backend proof that the REAL two-file upload pattern flows end to end, in both
      # orders (happy path + orphan self-heal). Runs without the emulator, so it is the
      # cheapest fidelity signal; gate it to stage 1 (later stages exercise the real APK).
      - name: Backend two-file acceptance
        if: env.STAGE == '1'
        run: ./k3s/route2-two-file-test.sh

      # 02 is offline and the local build's S3/API values point at the emulator host
      # alias, so these placeholder Android keys only let Gradle configuration resolve.
      # Route 2 needs no real Cognito/AWS secrets (static creds live in the local variant).
      - name: Write dummy Android keys
        run: |
          cat > treetracker-android/treetracker.keys.properties <<'KEYS'
          s3_production_identity_pool_id=placeholder
          prod_treetracker_client_id=placeholder
          prod_treetracker_client_secret=placeholder
          s3_test_identity_pool_id=placeholder
          test_treetracker_client_id=placeholder
          test_treetracker_client_secret=placeholder
          s3_dev_identity_pool_id=placeholder
          dev_treetracker_client_id=placeholder
          dev_treetracker_client_secret=placeholder
          treetracker_client_id=placeholder
          treetracker_client_secret=placeholder
          KEYS

      - name: Build local APK
        working-directory: treetracker-android
        run: |
          echo "::group::gradlew :app:assembleLocal"
          ./gradlew :app:assembleLocal --no-daemon --stacktrace --console=plain
          echo "::endgroup::"

      - name: Install e2e dependencies
        working-directory: apps/e2e
        run: npm ci

      # See android-e2e.yml: the @wdio/appium-service spawns a bare `appium`, so it must
      # be on PATH globally; pin the uiautomator2 driver to the lockfile-resolved version.
      - name: Install Appium and UiAutomator2 driver (global)
        run: |
          npm install -g appium@2.19.0
          appium driver install uiautomator2@3.10.0

      # The /verify step (stage 3) drives desktop Chrome via the chromedriver npm binary.
      # The runner's Chrome auto-updates, so match the driver to the installed major
      # instead of the package's pinned version, or the session fails to start.
      - name: Match chromedriver to runner Chrome
        if: env.STAGE == '3'
        working-directory: apps/e2e
        env:
          DETECT_CHROMEDRIVER_VERSION: "true"
          CHROMEDRIVER_FORCE_DOWNLOAD: "true"
        run: |
          google-chrome --version || true
          npm rebuild chromedriver

      # Record the capture baseline so stage 2 can assert the real upload LANDED.
      - name: Snapshot raw_capture baseline
        if: env.STAGE == '2'
        run: |
          POD=$(kubectl -n data get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          [ -n "$POD" ] || { echo "::error::no postgres pod"; exit 1; }
          BASE=$(kubectl -n data exec -i "$POD" -- \
            psql -U postgres -d treetracker -tAc "SELECT count(*) FROM field_data.raw_capture")
          echo "RAW_CAPTURE_BASELINE=${BASE:-0}" >> "$GITHUB_ENV"
          echo "raw_capture baseline = ${BASE:-0}"

      - name: Run E2E on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ github.workspace }}/treetracker-android/app/build/outputs/apk/local/app-local.apk
          APP_PACKAGE: org.greenstand.android.TreeTracker.local
          DEVICE_NAME: emulator-5554
          CAPTURE_ARTIFACTS: "1"
          # ADMIN_URL / ADMIN_USER / ADMIN_PASSWORD / E2E_SKIP_ADMIN_VERIFY / E2E_STRICT_TAGS
          # are inherited from the job env / the Resolve-stage step (strict is stage-1 only).
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_5
          # issue #23 fix, ported from the real-camera branches: raise guest RAM from the
          # pixel_5 default ~2GB so guest Android stops kill/respawn-thrashing its Google
          # leaf apps at boot (run 32682252289 attempt 1: ~52 signal-9 deaths in the boot
          # window = the 2GB pressure signature; the same churn measured on API 32/33/34).
          # 4096M is the MEASURED sweet spot (2GB ~33% a11y on API 34, 4GB ~64%, 6GB WORSE -
          # host over-allocation feeds back as jank). Written into the AVD config pre-boot.
          ram-size: 4096M
          disable-animations: true
          working-directory: apps/e2e
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          # The emulator-runner runs each script LINE as a separate `sh -c` and aborts
          # at the first non-zero line, so trailing capture lines never run after a wdio
          # failure. Wrap the run + logcat dump in ONE bash -c so the device log is always
          # captured (CameraX bind path + the .local bypass Timber line) before the exit.
          script: |
            adb wait-for-device
            adb logcat -c || true
            bash -c 'export PATH="$(pwd)/node_modules/.bin:$PATH"; mkdir -p test-artifacts; adb logcat > test-artifacts/logcat.txt 2>&1 & LPID=$!; ./node_modules/.bin/wdio run ./wdio.conf.ts --spec "features/$E2E_SPEC"; ec=$?; sleep 2; kill $LPID 2>/dev/null || true; mkdir -p test-artifacts/resources; { echo "== guest /proc/meminfo =="; adb shell cat /proc/meminfo; echo "== guest /proc/loadavg =="; adb shell cat /proc/loadavg; echo "== guest cpu core count =="; adb shell cat /proc/cpuinfo | grep -c ^processor; echo "== guest top =="; adb shell top -b -n 1 2>/dev/null | head -20; echo "== guest df =="; adb shell df; echo "== app dumpsys meminfo =="; adb shell dumpsys meminfo org.greenstand.android.TreeTracker.local 2>/dev/null | head -40; } > test-artifacts/resources/android-vm.txt 2>&1 || true; exit $ec'

      # Stage-2 fidelity assertion: the real APK's capture must have reached the DB.
      - name: Assert upload landed (stage 2)
        if: env.STAGE == '2'
        run: |
          POD=$(kubectl -n data get pod -l app=postgres -o jsonpath='{.items[0].metadata.name}')
          [ -n "$POD" ] || { echo "::error::no postgres pod"; exit 1; }
          NOW=$(kubectl -n data exec -i "$POD" -- \
            psql -U postgres -d treetracker -tAc "SELECT count(*) FROM field_data.raw_capture")
          echo "raw_capture now = ${NOW:-0} (baseline ${RAW_CAPTURE_BASELINE})"
          if [ "${NOW:-0}" -le "${RAW_CAPTURE_BASELINE}" ]; then
            echo "::error::real-app capture did not land in field_data.raw_capture"
            exit 1
          fi
          echo "real-app upload landed: raw_capture grew ${RAW_CAPTURE_BASELINE} -> ${NOW}"

      # Top-of-summary verdict: the stage + a PASS/FAIL headline + the spec that ran, at
      # the TOP of the run summary page. The summary renders in write order, so this step
      # runs BEFORE the Capture Journey / component / resource blocks below, giving a
      # volunteer the outcome first. job.status reflects every step that ran before this one
      # (the standup, the E2E, and the stage assertions), so it is the real verdict. On a
      # failure it also emits ONE titled annotation pointing at the evidence.
      - name: E2E verdict summary
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          case "$JOB_STATUS" in
            success)   VERDICT=":white_check_mark: PASSED" ;;
            cancelled) VERDICT=":grey_exclamation: CANCELLED" ;;
            *)         VERDICT=":x: FAILED"
                       echo "::error title=Route2 E2E failed (stage ${STAGE:-?})::The run did not pass. See the Capture Journey report in the run summary (it names the hop where capture stopped) and the e2e-route2-evidence-stage${STAGE:-?} artifact." ;;
          esac
          {
            echo "## E2E Route2 stage ${STAGE:-?}: ${VERDICT}"
            echo
            echo "Spec: \`${E2E_SPEC:-?}\`"
            echo
            echo "Evidence: the \`e2e-route2-evidence-stage${STAGE:-?}\` artifact (video, screenshots, logcat, reports). The Capture Journey report, component status, and resource utilization follow below."
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      # Always-on Capture Journey report: joins the scattered per-hop signals of the run
      # (cucumber steps, logcat Timber lines, the pipeline DB tables keyed by the note
      # fingerprint) into one ordered table that pinpoints where the capture stopped.
      # Placed BEFORE the Component status step so its summary block renders on top, and
      # before teardown so the DB is still queryable. Best-effort: it never fails the run.
      - name: Capture Journey report
        if: always()
        working-directory: apps/e2e
        run: |
          bash scripts/collect-journey-probes.sh || true
          node utils/capture-journey.mjs || true

      # Always-on component status roster (success or fail), captured while the cluster is
      # still up (before teardown): every pod + deployment readiness, to the artifacts AND
      # the run summary page so each run is self-documenting and the health of every
      # component is a tracked signal as the stack grows.
      - name: Component status report
        if: always()
        run: |
          DIR=apps/e2e/test-artifacts/status
          mkdir -p "$DIR"
          {
            echo "### Component status (stage ${STAGE:-?})"
            echo '```'
            kubectl get pods -A -o wide 2>&1 || true
            echo
            kubectl get deploy,cronjob -A 2>&1 || true
            echo '```'
          } | tee "$DIR/components.txt" >> "$GITHUB_STEP_SUMMARY"
          kubectl get svc -A > "$DIR/services.txt" 2>&1 || true

      # Always-on resource utilization report: the runner (host) resources captured
      # live here, plus the Android VM (guest) snapshot captured during the emulator
      # step (adb is gone once that step ends, so the guest half is read from the file
      # the emulator step wrote). Helps correlate the known boot-window guest kill-churn
      # flake with host contention. Best-effort: it never fails the run.
      - name: Resource utilization report
        if: always()
        run: |
          DIR=apps/e2e/test-artifacts/resources
          mkdir -p "$DIR"
          {
            echo "### Resource utilization (stage ${STAGE:-?})"
            echo
            echo "#### Runner (host)"
            echo '```'
            echo "CPUs: $(nproc)"
            echo "-- load average --"; cat /proc/loadavg
            echo "-- memory --"; free -h
            echo "-- disk (/) --"; df -h /
            echo "-- top processes by RSS --"; ps -eo pid,pcpu,pmem,rss,comm --sort=-rss 2>/dev/null | head -12
            echo '```'
            echo
            echo "#### Android VM (guest, captured during the emulator step)"
            echo '```'
            if [ -f "$DIR/android-vm.txt" ]; then cat "$DIR/android-vm.txt"; else echo "(not captured: the emulator step did not run)"; fi
            echo '```'
          } | tee "$DIR/report.txt" >> "$GITHUB_STEP_SUMMARY"

      # Cluster diagnostics for every run (pods + recent logs of the pipeline), captured
      # while the cluster is still up. Always-on so a green run keeps the same evidence a
      # red one does; the pod-log fan-out is best-effort and never fails the run.
      - name: Collect k3s diagnostics
        if: always()
        run: |
          DIR=apps/e2e/test-artifacts/k3s
          mkdir -p "$DIR"
          # up.sh writes each image build's output to /tmp/up-<name>-build.log; copy them into
          # the artifact so a standup build failure is diagnosable after the fact (ticket 28 -
          # the bulk-pack-processor flake's root line was unrecoverable without this).
          cp /tmp/up-*-build.log "$DIR/" 2>/dev/null || true
          kubectl get pods -A -o wide                    > "$DIR/pods.txt" 2>&1 || true
          kubectl get events -A --sort-by=.lastTimestamp > "$DIR/events.txt" 2>&1 || true
          for ns in webmap data object-storage bulk-pack-services field-data-api \
                    treetracker-api images-api admin-api admin-client emissary; do
            for pod in $(kubectl -n "$ns" get pods -o name 2>/dev/null); do
              name="${pod#pod/}"
              kubectl -n "$ns" logs --all-containers --tail=300 "$pod" \
                > "$DIR/logs-$ns-$name.txt" 2>&1 || true
            done
          done

      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-route2-evidence-stage${{ env.STAGE }}
          path: apps/e2e/test-artifacts/
          if-no-files-found: warn

      - name: Tear down cluster
        if: always()
        run: ./k3s/down.sh || true
